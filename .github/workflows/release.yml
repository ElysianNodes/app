name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build, such as v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer and update metadata
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/ElysianNodes-Setup-*.exe
            dist/ElysianNodes-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage and update metadata
        run: npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/ElysianNodes-*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: dist

      - name: Publish release assets
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match package version $version" >&2
            exit 1
          fi

          files=(
            "dist/ElysianNodes-Setup-$version.exe"
            "dist/ElysianNodes-Setup-$version.exe.blockmap"
            "dist/latest.yml"
            "dist/ElysianNodes-$version.AppImage"
            "dist/latest-linux.yml"
          )
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Build output is missing: $file" >&2
              exit 1
            fi
          done

          if ! gh release view "$tag" --repo ElysianNodes/app >/dev/null 2>&1; then
            gh release create "$tag" --repo ElysianNodes/app --title "ElysianNodes $version" --generate-notes --verify-tag
          fi
          gh release upload "$tag" "${files[@]}" --repo ElysianNodes/app --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
